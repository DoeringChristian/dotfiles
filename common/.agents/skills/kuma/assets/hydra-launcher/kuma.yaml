# @package hydra.launcher
# Kuma Slurm launcher: one array task per trial. Copy into configs/hydra/launcher/kuma.yaml;
# `pixi run kuma submit <overrides>` selects it. Override per study, e.g. hydra.launcher.timeout_min=90.
defaults:
  - submitit_slurm

account: rgl
partition: l40s           # l40s (default) | h100 (> 48 GB GPU memory, FP64, or measured speedup)
qos: normal               # normal (3 d) | long (7 d)
timeout_min: 60           # set from a measured trial: about 1.3x its wall time
nodes: 1
tasks_per_node: 1
gpus_per_node: 1
cpus_per_task: 8          # l40s <= 8 per GPU, h100 <= 16; memory is 5.9 GB per core
array_parallelism: 16
name: ${oc.select:run.name,${hydra.job.name}}   # the run name when the config has one
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
