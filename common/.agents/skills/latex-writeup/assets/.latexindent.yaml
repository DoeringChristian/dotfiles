modifyLineBreaks:
  oneSentencePerLine:
    manipulateSentences: 1
    removeSentenceLineBreaks: 1
    multipleSpacesToSingle: 1
    textWrapSentences: 1
    sentencesBeginWith:
      A-Z: 1
      a-z: 0
      other: 0
    sentencesEndWith:
      basicFullStop: 0
      betterFullStop: 0
      exclamationMark: 1
      questionMark: 1
      # other: 0
      other: '(?<!(?:e\.g|i\.e|etc))\.(?![a-z0-9\-~,])[\}\]]*'
  textWrapOptions:
    columns: 80
