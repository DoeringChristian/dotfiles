# Ensure dotfiles programs are findable on the remote. brew prefixes first; the
# mise shims are appended as a fallback for hosts not yet migrated to brew.
env PATH=$PATH:$HOME/.local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/.homebrew/bin:$HOME/.local/share/mise/shims

# Use fish on remote if available, otherwise falls back to default shell
login_shell fish
