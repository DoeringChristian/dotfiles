# pixi-global.toml — the complete CLI toolset on Linux (and any rootless box),
# via conda-forge. Fully rootless, prebuilt binaries (no compiler needed), lands
# on PATH in ~/.pixi/bin. Install with:  pixi global sync --manifest-path pkg/pixi-global.toml
#
# This is the Linux half of the simple package system (macOS half = pkg/Brewfile).
# GUI apps (kitty/tev) and from-source tools (sshr/passage) that conda-forge lacks
# are handled by pkg/extras.sh. pkg/install.sh dispatches per OS.
#
# conda-forge naming quirks vs brew: fd-find (fd), tree-sitter-cli (tree-sitter),
# nodejs (node).

version = 1

[envs.dotfiles]
channels = ["conda-forge"]
dependencies = { neovim = "*", vim = "*", ripgrep = "*", "fd-find" = "*", eza = "*", bat = "*", fzf = "*", zoxide = "*", dust = "*", duf = "*", "tree-sitter-cli" = "*", gh = "*", git-lfs = "*", lazygit = "*", direnv = "*", starship = "*", atuin = "*", zellij = "*", btop = "*", uv = "*", age = "*", typst = "*", stow = "*", "claude-agent-acp" = "*", nodejs = "*", python = "*", rust = "*", git = "*", fish = "*", tree = "*", wget = "*", mosh = "*", ncdu = "*", curl = "*", unzip = "*", zip = "*", gzip = "*", which = "*", file = "*" }
exposed = { nvim = "nvim", vim = "vim", rg = "rg", fd = "fd", eza = "eza", bat = "bat", fzf = "fzf", zoxide = "zoxide", dust = "dust", duf = "duf", "tree-sitter" = "tree-sitter", gh = "gh", "git-lfs" = "git-lfs", lazygit = "lazygit", direnv = "direnv", starship = "starship", atuin = "atuin", zellij = "zellij", btop = "btop", uv = "uv", uvx = "uvx", age = "age", "age-keygen" = "age-keygen", typst = "typst", stow = "stow", "claude-agent-acp" = "claude-agent-acp", node = "node", npm = "npm", npx = "npx", python = "python", python3 = "python3", cargo = "cargo", rustc = "rustc", git = "git", fish = "fish", tree = "tree", wget = "wget", mosh = "mosh", "mosh-server" = "mosh-server", ncdu = "ncdu", curl = "curl", unzip = "unzip", zip = "zip", gzip = "gzip", gunzip = "gunzip", which = "which", file = "file", less = "less" }
